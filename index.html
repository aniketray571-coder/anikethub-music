<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="Aniket Hub Music - sabse naye trending Bollywood aur Indie gaane ek jagah.">
    <title>Aniket Hub Music - Trending Hits</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #181818;
            --surface-hover: #242424;
            --accent: #1db954;
            --text: #ffffff;
            --muted: #a7a7a7;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .app {
            max-width: 560px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
        }
        h1 {
            color: var(--accent);
            font-size: 22px;
            margin: 0 0 4px;
            letter-spacing: 0.3px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }

        /* Player */
        .player-box {
            background: var(--surface);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .now-playing {
            margin-top: 12px;
            text-align: center;
        }
        #current-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #current-artist {
            font-size: 13px;
            color: var(--muted);
            margin: 2px 0 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .icon-btn:hover { background: var(--surface-hover); color: var(--accent); }
        .play-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(29,185,84,0.4);
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .play-btn:hover { transform: scale(1.07); box-shadow: 0 6px 20px rgba(29,185,84,0.55); }
        .play-btn:active { transform: scale(0.96); }
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        svg { display: block; }

        /* Filters */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .list-header h2 {
            font-size: 18px;
            margin: 0;
        }
        .filters {
            display: flex;
            gap: 8px;
        }
        .chip {
            background: var(--surface);
            color: var(--text);
            border: 1px solid #2a2a2a;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .chip[aria-pressed="true"] {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* Playlist */
        .playlist {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .song-card {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: var(--surface);
            color: var(--text);
            border: none;
            border-left: 4px solid transparent;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font: inherit;
            transition: background 0.2s, border-color 0.2s;
        }
        .song-card:hover { background: var(--surface-hover); }
        .song-card.active {
            background: var(--surface-hover);
            border-left-color: var(--accent);
        }
        .rank {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }
        .song-card.active .rank { color: var(--accent); }
        .thumb {
            position: relative;
            width: 64px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .song-info {
            flex: 1;
            min-width: 0;
        }
        .song-name {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .song-name span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-card.active .song-name { color: var(--accent); }
        .song-artist {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin: 2px 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            font-style: normal;
            flex-shrink: 0;
            background: rgba(29,185,84,0.15);
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .card-play {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            transform: scale(0.92);
            transition: transform 0.15s, opacity 0.15s;
        }
        .song-card:hover .card-play,
        .song-card.active .card-play { opacity: 1; transform: scale(1); }

        /* Equalizer animation for the playing song */
        .eq {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
        }
        .eq i {
            width: 3px;
            background: #000;
            border-radius: 1px;
            animation: eq 0.9s ease-in-out infinite;
        }
        .eq i:nth-child(2) { animation-delay: 0.2s; }
        .eq i:nth-child(3) { animation-delay: 0.4s; }
        @keyframes eq {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .eq i { animation: none; height: 10px; }
        }
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>Aniket Hub Trending Music</h1>
            <p class="subtitle">Sabse naye aur trending gaane, ek jagah</p>
        </header>

        <main>
            <section class="player-box" aria-label="Music player">
                <div class="video-container">
                    <div id="yt-player"></div>
                </div>
                <div class="now-playing" aria-live="polite">
                    <p id="current-title">Loading...</p>
                    <p id="current-artist"></p>
                </div>
                <div class="controls">
                    <button class="icon-btn" type="button" onclick="prevSong()" aria-label="Previous song">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
                    </button>
                    <button class="play-btn" id="main-play" type="button" onclick="togglePlay()" aria-label="Play">
                        <svg id="main-play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"></svg>
                    </button>
                    <button class="icon-btn" type="button" onclick="nextSong()" aria-label="Next song">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                    </button>
                </div>
            </section>

            <section aria-labelledby="list-title">
                <div class="list-header">
                    <h2 id="list-title">Trending Now</h2>
                    <div class="filters" role="group" aria-label="Filter songs">
                        <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
                        <button class="chip" type="button" data-filter="new" aria-pressed="false">New</button>
                    </div>
                </div>
                <ul class="playlist" id="playlist-box"></ul>
            </section>
        </main>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // =====================================================
        // NAYE YOUTUBE GAANE YAHAN JODEIN
        // { title, artist, videoId, isNew }
        // =====================================================
        const songs = [
            { title: "No Snitching", artist: "Vin WRLD & Harshit Rao", videoId: "Y4a0w1_ZblA" },
            { title: "Saiyaara (Title Song)", artist: "Faheem Abdullah, Arslan Nizami", videoId: "BSJa1UytM8w" },
            { title: "Barbaad", artist: "Jubin Nautiyal - Saiyaara", videoId: "0v5eHPfy5Lk", isNew: true },
            { title: "Dhun", artist: "Arijit Singh, Mithoon - Saiyaara", videoId: "xH4daEJvaZY", isNew: true },
            { title: "Tum Ho Toh", artist: "Vishal Mishra, Hansika Pareek - Saiyaara", videoId: "8SYPKQMW_2Q", isNew: true },
            { title: "Gehra Hua", artist: "Arijit Singh - Dhurandhar", videoId: "GX9x62kFsVU" },
            { title: "Shararat", artist: "Jasmine Sandlas, Madhubanti Bagchi - Dhurandhar", videoId: "YyepU5ztLf4", isNew: true },
            { title: "Ishq Jalakar - Karvaan", artist: "Shashwat Sachdev - Dhurandhar", videoId: "8qCVXCFREkQ", isNew: true },
            { title: "Sahiba", artist: "Aditya Rikhari", videoId: "n2dVFdqMYGA", isNew: true },
            { title: "Finding Her", artist: "Kushagra, Bharath, Saheal", videoId: "3Cp2QTBZAFQ", isNew: true },
            { title: "Pal Pal", artist: "Afusic", videoId: "8of5w7RgcTc", isNew: true },
            { title: "Jhol", artist: "Maanu, Annural Khalid", videoId: "pBLZIYTNrPc", isNew: true },
            { title: "Ishq", artist: "Faheem Abdullah, Rauhan Malik", videoId: "hHuG7FIKgtc", isNew: true },
            { title: "Raanjhan", artist: "Parampara Tandon - Do Patti", videoId: "lBvbNxiVmZA", isNew: true },
            { title: "Aaj Ki Raat", artist: "Madhubanti Bagchi, Divya Kumar - Stree 2", videoId: "roz9sXFkTuE" },
            { title: "Bhool Bhulaiyaa 3 - Title Track", artist: "Pitbull, Diljit Dosanjh, Neeraj Shridhar", videoId: "Cus-6cnyt1s" },
            { title: "Tauba Tauba", artist: "Karan Aujla - Bad Newz", videoId: "LK7-_dgAVQE" },
            { title: "Jaana Samjho Na", artist: "Aditya Rikhari, Tulsi Kumar - BB3", videoId: "0PyHEaoZE1c" },
            { title: "Sajni", artist: "Arijit Singh - Laapataa Ladies", videoId: "k3g_WjLCsXM" }
        ];

        const ICONS = {
            play: '<path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.04-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/>',
            pause: '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'
        };

        let currentIndex = 0;
        let isPlaying = false;
        let filter = "all";
        let player;

        const titleText = document.getElementById('current-title');
        const artistText = document.getElementById('current-artist');
        const playlistBox = document.getElementById('playlist-box');
        const mainPlayBtn = document.getElementById('main-play');
        const mainPlayIcon = document.getElementById('main-play-icon');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: songs[0].videoId,
                playerVars: { playsinline: 1, rel: 0 },
                events: { onStateChange: onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextSong();
                return;
            }
            const playing = event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING;
            if (playing !== isPlaying) {
                isPlaying = playing;
                updateUI();
            }
        }

        function playSong(index) {
            if (!player || !player.loadVideoById) return;
            if (index === currentIndex && isPlaying) {
                player.pauseVideo();
                return;
            }
            if (index === currentIndex && player.getVideoData && player.getVideoData().video_id === songs[index].videoId) {
                player.playVideo();
                return;
            }
            currentIndex = index;
            player.loadVideoById(songs[currentIndex].videoId);
            isPlaying = true;
            updateUI();
        }

        function togglePlay() {
            if (!player || !player.playVideo) return;
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        }

        function visibleIndexes() {
            return songs.map((_, i) => i).filter(i => filter === "all" || songs[i].isNew);
        }

        function stepSong(direction) {
            const list = visibleIndexes();
            const pos = list.indexOf(currentIndex);
            const nextPos = pos === -1 ? 0 : (pos + direction + list.length) % list.length;
            currentIndex = list[nextPos];
            player.loadVideoById(songs[currentIndex].videoId);
            isPlaying = true;
            updateUI();
        }

        function nextSong() { if (player) stepSong(1); }
        function prevSong() { if (player) stepSong(-1); }

        function updateUI() {
            const song = songs[currentIndex];
            titleText.textContent = song.title;
            artistText.textContent = song.artist;
            mainPlayIcon.innerHTML = isPlaying ? ICONS.pause : ICONS.play;
            mainPlayBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
            renderPlaylist();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderPlaylist() {
            playlistBox.innerHTML = "";
            visibleIndexes().forEach((index, pos) => {
                const song = songs[index];
                const active = index === currentIndex;
                const playingNow = active && isPlaying;

                const li = document.createElement('li');
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'song-card' + (active ? ' active' : '');
                card.setAttribute('aria-label', `${playingNow ? 'Pause' : 'Play'} ${song.title} by ${song.artist}`);
                if (active) card.setAttribute('aria-current', 'true');

                const actionIcon = playingNow
                    ? '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>'
                    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS.play}</svg>`;

                card.innerHTML = `
                    <span class="rank" aria-hidden="true">${pos + 1}</span>
                    <span class="thumb"><img src="https://i.ytimg.com/vi/${song.videoId}/mqdefault.jpg" alt="" loading="lazy" width="64" height="48"></span>
                    <span class="song-info">
                        <span class="song-name"><span>${escapeHTML(song.title)}</span>${song.isNew ? '<em class="badge">NEW</em>' : ''}</span>
                        <span class="song-artist">${escapeHTML(song.artist)}</span>
                    </span>
                    <span class="card-play">${actionIcon}</span>
                `;
                card.onclick = () => playSong(index);
                li.appendChild(card);
                playlistBox.appendChild(li);
            });
        }

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                filter = chip.dataset.filter;
                document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
                renderPlaylist();
            });
        });

        updateUI();
    </script>
</body>
</html>
